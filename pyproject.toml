[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thz-quantum-optimization"
version = "0.1.0"
description = "Classical foundation for a QUBO formulation of terahertz interferometric array configuration"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "manas-vamsi" }]
keywords = ["interferometry", "terahertz", "uv-coverage", "qubo", "array-design"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
# Not used by anything yet -- the first milestone is entirely classical.
quantum = ["dimod>=0.12", "dwave-neal>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
